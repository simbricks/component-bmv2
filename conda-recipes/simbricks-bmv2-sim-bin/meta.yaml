{% set name = "simbricks-bmv2-sim-bin" %}

package:
  name: {{ name|lower }}
  version: {{ simbricks_version }}

source:
  path: ../..

build:
  number: 0
  skip: true  # [not linux]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
    # `configure` is not checked into the bmv2 submodule, so autogen.sh (autoheader
    # + autoreconf -fi) has to run as part of the build.
    - autoconf
    - automake
    - libtool
    - m4
    - pkg-config
    # The `thrift` IDL compiler, invoked by the generated makefile rules to produce
    # the C++ and python runtime stubs.
    - thrift-compiler
    - python >=3.10
  host:
    - simbricks-lib >=0.5.0      # headers + libsimbricks for the <simbricks/...> build
    - thrift-cpp
    - libboost-devel
    - gmp
    - libpcap
  run:
    - python >=3.10
    # The python thrift runtime used by simple_switch_CLI / bm_CLI. Unlike the
    # C/C++ deps above it carries no run_exports, so it has to be listed here.
    - thrift
    - simbricks-bmv2-sim-py =={{ simbricks_version }}   # internal, co-built -> == pin

test:
  commands:
    - test -x $PREFIX/opt/bmv2/bin/simple_switch
    - test -f $PREFIX/opt/bmv2/share/p4/basic.json
    - $PREFIX/opt/bmv2/bin/simple_switch --help

about:
  home: {{ homepage }}
  license: MIT
  license_family: MIT
  summary: bmv2 P4 software switch with SimBricks support
  dev_url: https://github.com/simbricks/component-bmv2

extra:
  recipe-maintainers:
    - Team SimBricks <team@simbricks.io>
